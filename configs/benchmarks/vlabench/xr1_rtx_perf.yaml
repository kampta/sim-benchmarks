# Three exact pinned episodes already measured on GB10. This is a throughput
# gate, not a benchmark score; results must never enter the final 2,460 union.
server:
  url: "ws://localhost:18000"
  timeout: 300.0

docker:
  image: "${oc.env:XR1_VLABENCH_IMAGE,sim-benchmarks/vlabench:cf588fe-cuda128-amd64}"
  gpus: "${oc.env:XR1_SIM_GPU_IDS,0}"
  env:
    - "MUJOCO_EGL_DEVICE_ID=0"

output_dir: "/data/shared2/user/kampta/logs/sim_benchmarks/vlabench/xr1_rtx_perf"

benchmarks:
  - benchmark: "sim_benchmarks.benchmarks.vlabench_xr1:XR1VLABenchBenchmark"
    subname: "track_1_in_distribution_perf_only"
    episodes_per_task: 1
    max_steps: 300
    params:
      tasks: ["select_painting"]
      robot: "franka"
      max_steps: 300
      eval_track: "track_1_in_distribution"
      episode_limit: 3
      seed: 42
      intention_score_threshold: 0.1
      position_offset: [0.0, -0.4, 0.78]
