# Contract smoke test only; this is not the official VLABench reproduction suite.
server:
  url: "ws://localhost:18000"
  timeout: 300.0

docker:
  image: "${oc.env:XR1_VLABENCH_IMAGE,sim-benchmarks/vlabench:cf588fe}"
  gpus: "${oc.env:XR1_SIM_GPU_IDS,all}"
  env:
    - "MUJOCO_EGL_DEVICE_ID=0"

output_dir: "/data/shared2/user/kampta/logs/sim_benchmarks/vlabench/xr1_smoke"

benchmarks:
  - benchmark: "sim_benchmarks.benchmarks.vlabench_xr1:XR1VLABenchBenchmark"
    episodes_per_task: 1
    params:
      tasks:
        - "select_fruit"
      robot: "franka"
      max_steps: 300
      eval_track: "track_1_in_distribution"
      episode_limit: 1
      seed: 42
      intention_score_threshold: 0.1
      position_offset: [0.0, -0.4, 0.78]
