# Crash-safe continuation of the pinned five-track XR-1 run. The manifest was
# generated from validated recording databases and filters exact episode IDs.
server:
  url: "ws://localhost:18000"
  timeout: 300.0

docker:
  image: "${oc.env:XR1_VLABENCH_IMAGE,sim-benchmarks/vlabench:cf588fe}"
  gpus: "${oc.env:XR1_SIM_GPU_IDS,all}"
  volumes:
    - "${oc.env:XR1_BENCHMARK_SRC,/data/shared2/user/kampta/code/sim_benchmarks/.slide-worktrees/sim_benchmarks/src/sim_benchmarks}:/opt/venv/lib/python3.10/site-packages/sim_benchmarks:ro"
    - "${oc.env:XR1_COMPLETED_MANIFEST,/data/shared2/user/kampta/logs/sim_benchmarks/vlabench/xr1_official_flash_20260812/resume/completed-55.json}:/workspace/resume/completed.json:ro"
  env:
    - "MUJOCO_EGL_DEVICE_ID=0"

output_dir: "/data/shared1/cache/sim_benchmarks/vlabench/xr1_resume_20260813"

benchmarks:
  - benchmark: &benchmark "sim_benchmarks.benchmarks.vlabench_xr1:XR1VLABenchBenchmark"
    subname: "track_1_in_distribution"
    episodes_per_task: 1
    max_steps: 300
    params: &params
      robot: "franka"
      max_steps: 300
      eval_track: "track_1_in_distribution"
      episode_limit: 50
      seed: 42
      intention_score_threshold: 0.1
      position_offset: [0.0, -0.4, 0.78]
      completed_episode_manifest: "/workspace/resume/completed.json"
  - benchmark: *benchmark
    subname: "track_2_cross_category"
    episodes_per_task: 1
    max_steps: 300
    params:
      <<: *params
      eval_track: "track_2_cross_category"
  - benchmark: *benchmark
    subname: "track_3_common_sense"
    episodes_per_task: 1
    max_steps: 300
    params:
      <<: *params
      eval_track: "track_3_common_sense"
  - benchmark: *benchmark
    subname: "track_4_semantic_instruction"
    episodes_per_task: 1
    max_steps: 300
    params:
      <<: *params
      eval_track: "track_4_semantic_instruction"
  - benchmark: *benchmark
    subname: "track_6_unseen_texture"
    episodes_per_task: 1
    max_steps: 300
    params:
      <<: *params
      eval_track: "track_6_unseen_texture"
