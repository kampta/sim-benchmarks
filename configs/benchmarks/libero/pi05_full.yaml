# Standard LIBERO-Object protocol: 10 tasks x 50 episodes.
server:
  url: "ws://localhost:18010"
  timeout: 600.0

docker:
  image: "ghcr.io/allenai/vla-evaluation-harness/libero@sha256:2a4566009395888ae3904bde87cffceea7526e2e0f0667b933cae0e8e6134413"
  gpus: "all"

output_dir: "/data/shared2/user/kampta/logs/sim_benchmarks/libero/pi05_full"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_object
    episodes_per_task: 50
    params:
      suite: libero_object
      seed: 7
      num_steps_wait: 10
